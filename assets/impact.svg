<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title">
  <title id="title">Impact: 40% faster page loads, 10K+ concurrent users, 100K+ registered users, 99.9% real-time uptime</title>
  <style>
    .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .bar { animation: grow 2.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .b2 { animation-delay: 0.3s; }
    .b3 { animation-delay: 0.6s; }
    @keyframes grow { from { transform: scaleY(0.45); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- card 1 -->
  <g class="c">
    <rect x="0.5" y="0.5" width="287" height="199" rx="16" fill="#0B0D12" stroke="#1E2330"/>
    <rect x="24" y="196" width="80" height="3" rx="1.5" fill="#A259FF"/>
    <circle cx="30" cy="34" r="4" fill="#A259FF"/>
    <text x="42" y="38" class="mono" font-size="11" letter-spacing="1.2" fill="#8B93A7">PERFORMANCE</text>
    <g fill="#A259FF" fill-opacity="0.5"><rect class="bar" x="234" y="30" width="6" height="12" rx="2"/><rect class="bar b2" x="244" y="24" width="6" height="18" rx="2"/><rect class="bar b3" x="254" y="18" width="6" height="24" rx="2"/></g>
    <text x="24" y="112" class="sans" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#A259FF">40%</text>
    <text x="24" y="146" class="sans" font-size="17" font-weight="600" fill="#E6E9F2">faster page loads</text>
    <text x="24" y="170" class="sans" font-size="13" fill="#8B93A7">SSR · SSG · ISR in Next.js</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(304 0)"><g class="c c2">
    <rect x="0.5" y="0.5" width="287" height="199" rx="16" fill="#0B0D12" stroke="#1E2330"/>
    <rect x="24" y="196" width="80" height="3" rx="1.5" fill="#1ABCFE"/>
    <circle cx="30" cy="34" r="4" fill="#1ABCFE"/>
    <text x="42" y="38" class="mono" font-size="11" letter-spacing="1.2" fill="#8B93A7">SCALE</text>
    <g fill="#1ABCFE" fill-opacity="0.5"><rect class="bar" x="234" y="30" width="6" height="12" rx="2"/><rect class="bar b2" x="244" y="24" width="6" height="18" rx="2"/><rect class="bar b3" x="254" y="18" width="6" height="24" rx="2"/></g>
    <text x="24" y="112" class="sans" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#1ABCFE">10K+</text>
    <text x="24" y="146" class="sans" font-size="17" font-weight="600" fill="#E6E9F2">concurrent users</text>
    <text x="24" y="170" class="sans" font-size="13" fill="#8B93A7">WebSocket infra on PubNub</text>
  </g></g>

  <!-- card 3 -->
  <g transform="translate(608 0)"><g class="c c3">
    <rect x="0.5" y="0.5" width="287" height="199" rx="16" fill="#0B0D12" stroke="#1E2330"/>
    <rect x="24" y="196" width="80" height="3" rx="1.5" fill="#0ACF83"/>
    <circle cx="30" cy="34" r="4" fill="#0ACF83"/>
    <text x="42" y="38" class="mono" font-size="11" letter-spacing="1.2" fill="#8B93A7">REACH</text>
    <g fill="#0ACF83" fill-opacity="0.5"><rect class="bar" x="234" y="30" width="6" height="12" rx="2"/><rect class="bar b2" x="244" y="24" width="6" height="18" rx="2"/><rect class="bar b3" x="254" y="18" width="6" height="24" rx="2"/></g>
    <text x="24" y="112" class="sans" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#0ACF83">100K+</text>
    <text x="24" y="146" class="sans" font-size="17" font-weight="600" fill="#E6E9F2">registered users</text>
    <text x="24" y="170" class="sans" font-size="13" fill="#8B93A7">on the EasyWebinar platform</text>
  </g></g>

  <!-- card 4 -->
  <g transform="translate(912 0)"><g class="c c4">
    <rect x="0.5" y="0.5" width="287" height="199" rx="16" fill="#0B0D12" stroke="#1E2330"/>
    <rect x="24" y="196" width="80" height="3" rx="1.5" fill="#FF7262"/>
    <circle cx="30" cy="34" r="4" fill="#FF7262"/>
    <text x="42" y="38" class="mono" font-size="11" letter-spacing="1.2" fill="#8B93A7">RELIABILITY</text>
    <g fill="#FF7262" fill-opacity="0.5"><rect class="bar" x="234" y="30" width="6" height="12" rx="2"/><rect class="bar b2" x="244" y="24" width="6" height="18" rx="2"/><rect class="bar b3" x="254" y="18" width="6" height="24" rx="2"/></g>
    <text x="24" y="112" class="sans" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#FF7262">99.9%</text>
    <text x="24" y="146" class="sans" font-size="17" font-weight="600" fill="#E6E9F2">real-time uptime</text>
    <text x="24" y="170" class="sans" font-size="13" fill="#8B93A7">live chat, polls &amp; transcriptions</text>
  </g></g>
</svg>
