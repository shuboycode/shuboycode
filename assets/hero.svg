<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Shubham Kumar, SDE 1 and Full Stack Developer</title>
  <desc id="desc">A design-tool style canvas with Shubham Kumar's name selected inside a frame, a layers panel, a client-to-database architecture card and two live cursors.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#232838"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A259FF"/>
      <stop offset="0.5" stop-color="#1ABCFE"/>
      <stop offset="1" stop-color="#0ACF83"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A259FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A259FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1ABCFE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1ABCFE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="460" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .caret { animation: blink 1.1s step-end infinite; }
    .me    { animation: bob 3.2s ease-in-out infinite; }
    .you   { animation: roam 11s ease-in-out infinite; }
    .live  { animation: pulse 2s ease-in-out infinite; }
    .handle { animation: pulse 2.6s ease-in-out infinite; }
    .flow  { stroke-dasharray: 3 3; animation: flow 0.9s linear infinite; }
    @keyframes flow  { to { stroke-dashoffset: -12; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes bob   { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(7px, -5px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes roam {
      0%, 100% { transform: translate(0, 0); }
      22%      { transform: translate(-250px, -30px); }
      45%      { transform: translate(-130px, -250px); }
      68%      { transform: translate(40px, -140px); }
      84%      { transform: translate(-40px, -20px); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="460" fill="#0B0D12"/>
    <rect x="220" y="52" width="980" height="408" fill="url(#dots)"/>
    <ellipse cx="520" cy="200" rx="380" ry="260" fill="url(#glowV)"/>
    <ellipse cx="1080" cy="430" rx="300" ry="220" fill="url(#glowB)"/>

    <!-- top bar -->
    <rect width="1200" height="52" fill="#11141C"/>
    <line x1="0" y1="52.5" x2="1200" y2="52.5" stroke="#1E2330"/>
    <circle cx="26" cy="26" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="26" r="6" fill="#FEBC2E"/>
    <circle cx="66" cy="26" r="6" fill="#28C840"/>
    <g fill="none" stroke="#6B7386" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M104 17 L104 33 L108.5 29 L112 36 L115 34.6 L111.6 27.8 L117 27.5 Z" fill="#6B7386"/>
      <path d="M138 18 V34 M146 18 V34 M134 22 H150 M134 30 H150"/>
      <rect x="166" y="19" width="14" height="14" rx="2"/>
      <path d="M198 33 L206 18 L214 33 M201 28 H211"/>
      <path d="M232 19 H246 M239 19 V34"/>
    </g>
    <g class="mono" font-size="12.5">
      <rect x="400" y="12" width="128" height="28" rx="8" fill="#1A1F2B" stroke="#A259FF" stroke-opacity="0.6"/>
      <circle class="live" cx="418" cy="26" r="4" fill="#A259FF"/>
      <text x="432" y="30.5" fill="#F5F7FB">hello.fig</text>
      <rect x="536" y="12" width="128" height="28" rx="8" fill="#141823"/>
      <circle cx="554" cy="26" r="4" fill="#1ABCFE"/>
      <text x="568" y="30.5" fill="#8B93A7">server.ts</text>
      <rect x="672" y="12" width="128" height="28" rx="8" fill="#141823"/>
      <circle cx="690" cy="26" r="4" fill="#0ACF83"/>
      <text x="704" y="30.5" fill="#8B93A7">schema.db</text>
    </g>
    <circle cx="1000" cy="26" r="13" fill="#0ACF83" stroke="#11141C" stroke-width="3"/>
    <text x="1000" y="30.5" class="sans" font-size="11" font-weight="700" fill="#062B1D" text-anchor="middle">Y</text>
    <circle cx="1020" cy="26" r="13" fill="#A259FF" stroke="#11141C" stroke-width="3"/>
    <text x="1020" y="30.5" class="sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
    <rect x="1046" y="12" width="72" height="28" rx="8" fill="#A259FF"/>
    <text x="1082" y="30.5" class="sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Share</text>
    <text x="1176" y="30.5" class="mono" font-size="12" fill="#6B7386" text-anchor="end">100%</text>

    <!-- layers panel -->
    <rect x="0" y="53" width="220" height="407" fill="#0F121A"/>
    <line x1="220.5" y1="53" x2="220.5" y2="460" stroke="#1E2330"/>
    <text x="20" y="86" class="sans" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6B7386">EXPLORER</text>
    <g class="mono" font-size="12.5">
      <text x="20" y="119" fill="#6B7386">▾</text><text x="36" y="119" fill="#F5F7FB" font-weight="700">shubham/</text>
      <text x="36" y="149" fill="#4B5263">▸</text><text x="52" y="149" fill="#C9D1E3">client/</text><circle cx="196" cy="145" r="3.5" fill="#A259FF"/>
      <text x="36" y="179" fill="#4B5263">▸</text><text x="52" y="179" fill="#C9D1E3">server/</text><circle cx="196" cy="175" r="3.5" fill="#1ABCFE"/>
      <text x="36" y="209" fill="#4B5263">▸</text><text x="52" y="209" fill="#C9D1E3">database/</text><circle cx="196" cy="205" r="3.5" fill="#0ACF83"/>
      <text x="36" y="239" fill="#4B5263">▸</text><text x="52" y="239" fill="#C9D1E3">realtime/</text><circle class="live" cx="196" cy="235" r="3.5" fill="#FF7262"/>
      <text x="36" y="269" fill="#4B5263">▸</text><text x="52" y="269" fill="#C9D1E3">design/</text><circle cx="196" cy="265" r="3.5" fill="#F24E1E"/>
      <rect x="8" y="282" width="204" height="28" rx="6" fill="#A259FF" fill-opacity="0.18"/>
      <text x="36" y="301" fill="#A259FF">◆</text><text x="52" y="301" fill="#F5F7FB">hello.fig</text>
      <text x="36" y="331" fill="#4B5263">◇</text><text x="52" y="331" fill="#A7AFC2">README.md</text>
    </g>
    <line x1="20" y1="372.5" x2="200" y2="372.5" stroke="#1E2330"/>
    <path d="M26 392 c-4.4 0 -7 3.2 -7 6.6 c0 4.6 7 11.4 7 11.4 s7 -6.8 7 -11.4 c0 -3.4 -2.6 -6.6 -7 -6.6 z" fill="#FF7262"/>
    <circle cx="26" cy="398.6" r="2.4" fill="#0F121A"/>
    <text x="42" y="405" class="sans" font-size="13" fill="#C9D1E3">Hyderabad, India</text>
    <circle class="live" cx="26" cy="429" r="4.5" fill="#0ACF83"/>
    <text x="42" y="433.5" class="sans" font-size="13" fill="#C9D1E3">5+ years shipping product</text>

    <!-- selected frame -->
    <text x="262" y="116" class="sans" font-size="12" font-weight="500" fill="#0D99FF">Frame 01 — hello</text>
    <rect x="264" y="126" width="600" height="196" fill="#0D99FF" fill-opacity="0.04" stroke="#0D99FF" stroke-width="1.5"/>
    <g fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.5">
      <rect x="260" y="122" width="8" height="8"/>
      <rect x="860" y="122" width="8" height="8"/>
      <rect x="260" y="318" width="8" height="8"/>
      <rect x="860" y="318" width="8" height="8"/>
      <rect class="handle" x="560" y="122" width="8" height="8"/>
      <rect class="handle" x="560" y="318" width="8" height="8"/>
      <rect class="handle" x="260" y="220" width="8" height="8"/>
      <rect class="handle" x="860" y="220" width="8" height="8"/>
    </g>
    <text x="292" y="176" class="sans" font-size="22" fill="#8B93A7">Hi there 👋 I'm</text>
    <text x="288" y="248" class="sans" font-size="70" font-weight="800" letter-spacing="-1.5" fill="#F5F7FB">Shubham Kumar</text>
    <text x="292" y="292" class="sans" font-size="24" font-weight="600" fill="url(#brand)">SDE 1 · Full Stack Developer<tspan class="caret" fill="#0ACF83"> ▍</tspan></text>
    <rect x="524" y="334" width="80" height="22" rx="4" fill="#0D99FF"/>
    <text x="564" y="349.5" class="mono" font-size="11.5" fill="#FFFFFF" text-anchor="middle">600 × 196</text>

    <text x="266" y="384" class="sans" font-size="17" fill="#A7AFC2">From Figma frame to API to production. I ship the whole thing.</text>
    <g class="sans" font-size="13" font-weight="500">
      <rect x="268" y="402" width="64" height="30" rx="15" fill="#151925" stroke="#262C3B"/>
      <text x="300" y="421.5" fill="#C9D1E3" text-anchor="middle">React</text>
      <rect x="342" y="402" width="80" height="30" rx="15" fill="#151925" stroke="#262C3B"/>
      <text x="382" y="421.5" fill="#C9D1E3" text-anchor="middle">Next.js</text>
      <rect x="432" y="402" width="104" height="30" rx="15" fill="#151925" stroke="#262C3B"/>
      <text x="484" y="421.5" fill="#C9D1E3" text-anchor="middle">TypeScript</text>
      <rect x="546" y="402" width="80" height="30" rx="15" fill="#151925" stroke="#262C3B"/>
      <text x="586" y="421.5" fill="#C9D1E3" text-anchor="middle">Node.js</text>
      <rect x="636" y="402" width="92" height="30" rx="15" fill="#151925" stroke="#262C3B"/>
      <text x="682" y="421.5" fill="#C9D1E3" text-anchor="middle">MongoDB</text>
      <rect x="738" y="402" width="92" height="30" rx="15" fill="#151925" stroke="#262C3B"/>
      <text x="784" y="421.5" fill="#C9D1E3" text-anchor="middle">UI/UX</text>
    </g>

    <!-- architecture card -->
    <rect x="920.5" y="96.5" width="240" height="236" rx="14" fill="#11141C" stroke="#1E2330"/>
    <text x="940" y="126" class="sans" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6B7386">FULL STACK · END TO END</text>
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <line class="flow" x1="1040" y1="174" x2="1040" y2="186" stroke="#1ABCFE"/>
      <line class="flow" x1="1040" y1="220" x2="1040" y2="232" stroke="#0ACF83"/>
      <line class="flow" x1="1040" y1="266" x2="1040" y2="278" stroke="#FF7262"/>
    </g>
    <g class="sans" font-size="12.5">
      <rect x="940.5" y="140.5" width="200" height="34" rx="8" fill="#151925" stroke="#A259FF" stroke-opacity="0.55"/>
      <circle cx="958" cy="157.5" r="4.5" fill="#A259FF"/>
      <text x="972" y="162" fill="#F5F7FB" font-weight="600">Client <tspan fill="#8B93A7" font-weight="400">React · Next.js</tspan></text>
      <rect x="940.5" y="186.5" width="200" height="34" rx="8" fill="#151925" stroke="#1ABCFE" stroke-opacity="0.55"/>
      <circle cx="958" cy="203.5" r="4.5" fill="#1ABCFE"/>
      <text x="972" y="208" fill="#F5F7FB" font-weight="600">API <tspan fill="#8B93A7" font-weight="400">Node.js · REST</tspan></text>
      <rect x="940.5" y="232.5" width="200" height="34" rx="8" fill="#151925" stroke="#0ACF83" stroke-opacity="0.55"/>
      <circle cx="958" cy="249.5" r="4.5" fill="#0ACF83"/>
      <text x="972" y="254" fill="#F5F7FB" font-weight="600">Data <tspan fill="#8B93A7" font-weight="400">MongoDB · S3</tspan></text>
      <rect x="940.5" y="278.5" width="200" height="34" rx="8" fill="#151925" stroke="#FF7262" stroke-opacity="0.55"/>
      <circle class="live" cx="958" cy="295.5" r="4.5" fill="#FF7262"/>
      <text x="972" y="300" fill="#F5F7FB" font-weight="600">Realtime <tspan fill="#8B93A7" font-weight="400">PubNub · WS</tspan></text>
    </g>

    <!-- comment -->
    <rect x="920.5" y="352.5" width="240" height="58" rx="12" fill="#1A1F2B" stroke="#262C3B"/>
    <circle cx="946" cy="381.5" r="13" fill="#A259FF"/>
    <text x="946" y="386" class="sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="968" y="376" class="sans" font-size="12" font-weight="700" fill="#F5F7FB">shuboy <tspan font-weight="400" fill="#6B7386">· just now</tspan></text>
    <text x="968" y="395" class="sans" font-size="12.5" fill="#A7AFC2">front to back. ship it 🚀</text>

    <!-- cursors -->
    <g transform="translate(796 276)">
      <g class="me">
        <path d="M0 0 L0 19 L5 14.5 L9 23 L12.6 21.4 L8.8 13 L15.5 12.6 Z" fill="#A259FF" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
        <rect x="14" y="20" width="62" height="22" rx="6" fill="#A259FF"/>
        <text x="45" y="35.5" class="sans" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">shuboy</text>
      </g>
    </g>
    <g transform="translate(880 380)">
      <g class="you">
        <path d="M0 0 L0 19 L5 14.5 L9 23 L12.6 21.4 L8.8 13 L15.5 12.6 Z" fill="#0ACF83" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
        <rect x="14" y="20" width="42" height="22" rx="6" fill="#0ACF83"/>
        <text x="35" y="35.5" class="sans" font-size="12" font-weight="700" fill="#062B1D" text-anchor="middle">you</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="20" fill="none" stroke="#1E2330"/>
</svg>
